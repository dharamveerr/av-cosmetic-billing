<!doctype html>
<html lang="en">
<head>

<script>try{var th=localStorage.getItem("shopbill-theme");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
